default:

  # [Disabled] [Experimental] This feature may be removed at any time without prior notice
  # and may undergo sudden changes; it is possible that it is not currently active.
  # Hides messages from other groups; if they are on the list, they will not be shown.
  HideOtherGroups:

    Enabled: true

    List:
      - admin

  # Allows for the customization of a welcome message that will only be visible to members of this group
  Welcome:

    Enabled: true

    # Here you can customize the welcome message you want to appear for this group
    Text:
      - ""

  # | Join |
  Join:

    # Here you can enable or disable this feature
    Enabled: true

    # Here you can define the entry message
    Format: "&e[&a+&e] &3{player} &7has joined the server"

    # Sets the delay before the join message is displayed
    JoinMessageDelay: 0s

    #
    Title-Settings:

      # Here you can enable or disable this feature
      Enabled: true

      # Here you can set the title text
      Title: ""

      # Here you can set the subtitle text
      SubTitle: ""

      # Sets the title fade-in time
      FadeIn: 20

      # Sets how long the title stays visible
      Stay: 40

      # Sets the title fade-out time
      FadeOut: 20

    #
    Actionbar:

      # Here you can enable or disable this feature
      Enabled: true

      # Sets the delay before the actionbar is displayed
      Delay: 0

      # Here you can set the actionbar message
      Format: ""

    Sound:

      # Here you can enable or disable this feature
      Enabled: true

      # When enabled, the sound is sent to all players connected to the server
      SendToAll: true

      # Sound name; see https://www.spigotmc.org/wiki/cc-sounds-list/
      Name: "BLOCK_NOTE_BLOCK_PLING"

      # Sound volume
      Volume: 10

      # Sound pitch
      Pitch: 1

  # | First Join |
  First-Join:

    # Here you can enable or disable this feature
    Enabled: true

    # Here you can define the first-join message
    Format: "&3Welcome to the server, we hope you enjoy your time here and have a good time"

    # Sets the delay before the first-join message is displayed
    FirstJoinMessageDelay: 0s

    #
    Title-Settings:

      # Here you can enable or disable this feature
      Enabled: true

      # Here you can set the title text
      Title: ""

      # Here you can set the subtitle text
      SubTitle: ""

      # Sets the title fade-in time
      FadeIn: 20

      # Sets how long the title stays visible
      Stay: 40

      # Sets the title fade-out time
      FadeOut: 20

    #
    Actionbar:

      # Here you can enable or disable this feature
      Enabled: true

      # Sets the delay before the actionbar is displayed
      Delay: 0s

      # Here you can set the actionbar message
      Format: ""

    #
    Sound:

      # Here you can enable or disable this feature
      Enabled: true

      # When enabled, the sound is sent to all players connected to the server
      SendToAll: true

      # Sound name; see https://www.spigotmc.org/wiki/cc-sounds-list/
      Name: "BLOCK_NOTE_BLOCK_PLING"

      # Sound volume
      Volume: 10

      # Sound pitch
      Pitch: 1

  # | Quit |
  Quit:

    # Here you can enable or disable this feature
    Enabled: true

    # Aqui puedes definir el mensaje de salida
    Format: "&e[&c-&e] &3{player} &7has left the server"

    #
    Title-Settings:

      # Here you can enable or disable this feature
      Enabled: true

      # Here you can set the title text
      Title: ""

      # Here you can set the subtitle text
      SubTitle: ""

      # Sets the title fade-in time
      FadeIn: 20

      # Sets how long the title stays visible
      Stay: 40

      # Sets the title fade-out time
      FadeOut: 20

    #
    Actionbar:

      # Here you can enable or disable this feature
      Enabled: true

      # Sets the delay before the actionbar is displayed
      Delay: 0s

      # Here you can set the actionbar message
      Format: ""

    #
    Sound:

      # Here you can enable or disable this feature
      Enabled: true

      # When enabled, the sound is sent to all players connected to the server
      SendToAll: true

      # Sound name; see https://www.spigotmc.org/wiki/cc-sounds-list/
      Name: "BLOCK_NOTE_BLOCK_PLING"

      # Sound volume
      Volume: 10

      # Sound pitch
      Pitch: 1